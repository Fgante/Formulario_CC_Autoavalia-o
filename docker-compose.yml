services:
  db:
    image: postgres:16-alpine
    container_name: gcsp-db
    environment:
      POSTGRES_DB: gcsp
      POSTGRES_USER: gcsp
      POSTGRES_PASSWORD: gcsp123
    ports:
      - "127.0.0.1:5433:5432"   # só acessível deste computador (DBeaver/pgAdmin): localhost:5433
    volumes:
      - gcsp_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcsp -d gcsp"]
      interval: 5s
      retries: 10

  app:
    build: ./app
    container_name: gcsp-app
    environment:
      DATABASE_URL: postgres://gcsp:gcsp123@db:5432/gcsp
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Link público temporário via Cloudflare Quick Tunnel (só sobe com: docker compose --profile tunel up -d)
  # O endereço https://xxxx.trycloudflare.com aparece em: docker compose logs tunel
  tunel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: gcsp-tunel
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    profiles: ["tunel"]
    restart: unless-stopped

volumes:
  gcsp_data:
